name: plan
scope: local
about: "Manage project tasks and steps with persistent state. Use to track work across sessions."

tools:
  # ── Task tools (top-level grouping) ──
  - name: plan_task_new
    description: "Create a new task with initial steps"
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Task name (e.g. 'implement-auth')"
        title:
          type: string
          description: "Human-readable task title"
        steps:
          type: array
          items:
            type: string
          description: "List of step titles to create"
        area:
          type: string
          description: "Functional area to assign (must exist in plan_area_list)"
      required:
        - name

  - name: plan_task_list
    description: "List all tasks in the workspace database"
    inputSchema:
      type: object
      properties:
        show_completed:
          type: boolean
          description: "Include completed tasks (default: false, only active shown)"
        show_all:
          type: boolean
          description: "Show tasks from all users (default: false, only current user's tasks)"
        area:
          type: string
          description: "Filter tasks to this functional area only"

  - name: plan_task_complete
    description: "Mark a task as completed (must not be the active task)"
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Task name to complete"
      required:
        - name

  - name: plan_task_switch
    description: "Switch to a different task"
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Task name to switch to"
      required:
        - name

  - name: plan_task_show
    description: "Show detailed information about a task"
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Task name (omit for active task)"
        titles_only:
          type: boolean
          description: "Return only step numbers and titles (omits notes, goal, plan, attachments — use for large tasks)"

  - name: plan_task_status
    description: "Show the active task and current step"
    inputSchema:
      type: object
      properties: {}

  - name: plan_task_notes_set
    description: "Set a note on a task. For goal/plan kinds, replaces the existing note (upsert by kind). For 'note' kind, pass id to update an existing note or omit to create new."
    inputSchema:
      type: object
      properties:
        text:
          type: string
          description: "Note text to set"
        name:
          type: string
          description: "Task name (omit for active task)"
        kind:
          type: string
          enum: ["goal", "plan", "note"]
          description: "Note kind: 'goal' (what), 'plan' (how), or 'note' (default)"
        id:
          type: integer
          description: "Note ID to update (omit to create new). Only used for 'note' kind."
      required:
        - text

  - name: plan_task_notes_get
    description: "View notes on a task. Returns notes with IDs for use with set/delete."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Task name (omit for active task)"
        kind:
          type: string
          enum: ["goal", "plan", "note"]
          description: "Filter by note kind (omit for all)"

  - name: plan_task_notes_delete
    description: "Delete a note from a task by ID"
    inputSchema:
      type: object
      properties:
        id:
          type: integer
          description: "Note ID to delete"
        name:
          type: string
          description: "Task name (omit for active task)"
      required:
        - id

  - name: plan_task_move
    description: "Move a task to a different project. Reports any attached files with full source and target paths so they can be moved manually on disk."
    inputSchema:
      type: object
      required: [name, project]
      properties:
        name:
          type: string
          description: "Task name to move"
        project:
          type: string
          description: "Target project name (or numeric ID if name is ambiguous)"

  - name: plan_task_rename
    description: "Rename a task's display title without changing its slug. Preserves all history."
    inputSchema:
      type: object
      required: [name, title]
      properties:
        name:
          type: string
          description: "Task slug (name) to rename"
        title:
          type: string
          description: "New display title"

  - name: plan_step_retitle
    description: "Retitle a step without affecting its status, completed_at, or order."
    inputSchema:
      type: object
      required: [number, title]
      properties:
        number:
          type: integer
          description: "Step number to retitle"
        title:
          type: string
          description: "New step title"

  - name: plan_task_adopt
    description: "Adopt (deep-copy) another user's task into your own task list. Copies all steps, notes (goal/plan/note), and step notes. Does NOT copy changelog."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Source task name to adopt"
        new_name:
          type: string
          description: "Name for the adopted copy (required if source name already exists in your tasks)"
        reset:
          type: boolean
          description: "Reset all step statuses to 'planned' (default: true). Set false to preserve original statuses."
      required:
        - name

  # ── Area tools ──
  - name: plan_area_new
    description: "Define one or more functional areas for this project. Single: supply `name` (+ optional `description`, `class`, `type`, `priority`, `scope`, `watch`, `depends`). Batch: supply `items` list."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Area name (single-area mode)"
        description:
          type: string
          description: "What this area does (single-area mode)"
        class:
          type: string
          enum: ["product", "tooling"]
          description: "product = ships to users; tooling = builds, proves or reaches the product"
        type:
          type: string
          enum: ["firmware", "service", "library", "contract", "tool", "gate", "doc"]
          description: "HOW this area is PROVEN — independent of class. firmware = runs on a device, proved on hardware or by a build gate, never a host test; service = a long-running host process, proved by being up and answering; library = code with no lifetime, proved by host tests; contract = a shared wire format or schema, proved by peers agreeing and a hash gate holding it; tool = a human or a build runs it, proved by running from where you would reach for it; gate = a check that fails a build, proved by having been seen to go RED; doc = prose that governs work, proved by matching the code it cites. One value only: pick the one whose proof, if skipped, would let a defect through."
        scope:
          type: array
          items:
            type: string
          description: "File glob patterns owned by this area (e.g. ['src/radio/**', 'tests/test_radio.py']). Enables file-ownership check."
        watch:
          type: array
          items:
            type: string
          description: "File paths whose change invalidates this area's sign-off (e.g. ['rak/v3/src/main.cpp'])"
        depends:
          type: array
          items:
            type: string
          description: "Area names this area depends on. Gates ordering: a gated area is NOT startable. Names must be existing areas."
        items:
          type: array
          description: "Batch mode: list of areas to create atomically. Mutually exclusive with `name`."
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                description: "Area name"
              description_md:
                type: string
                description: "What this area does"
              class:
                type: string
                enum: ["product", "tooling"]
                description: "product or tooling"
              type:
                type: string
                enum: ["firmware", "service", "library", "contract", "tool", "gate", "doc"]
                description: "How this area is proven: firmware (hardware or a build gate), service (up and answering), library (host tests), contract (peers agree, hash gate holds it), tool (it runs), gate (seen to go RED), doc (matches the code it cites)"
              priority:
                type: integer
                description: "Ordering within class"
              scope:
                type: array
                items:
                  type: string
                description: "File glob patterns owned by this area"
              watch:
                type: array
                items:
                  type: string
                description: "Files whose change invalidates sign-off"
              depends:
                type: array
                items:
                  type: string
                description: "Area names this area depends on"

  - name: plan_area_list
    description: "List functional areas defined for this project"
    inputSchema:
      type: object
      properties: {}

  - name: plan_task_set_area
    description: "Set or clear the functional area on a task"
    inputSchema:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "Task slug to update"
        area:
          type: string
          description: "Area name to set (omit to clear)"

  - name: plan_area_rename
    description: "Rename a functional area; cascades to all tasks assigned to it"
    inputSchema:
      type: object
      required: [name, new_name]
      properties:
        name:
          type: string
          description: "Current area name"
        new_name:
          type: string
          description: "New area name"

  - name: plan_area_describe
    description: "Set or update metadata on an existing area: description, class, type, priority, scope, watch, and/or depends. Supply at least one. Omitting a field leaves it unchanged."
    inputSchema:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "Area name to update"
        description:
          type: string
          description: "New description (markdown). Omit to leave unchanged; pass null or empty string to clear."
        class:
          type: string
          enum: ["product", "tooling"]
          description: "product = ships; tooling = builds/proves/reaches the product"
        type:
          type: string
          enum: ["firmware", "service", "library", "contract", "tool", "gate", "doc"]
          description: "HOW this area is PROVEN — independent of class, and one value only. firmware = hardware or a build gate, never a host test; service = up and answering; library = host tests; contract = peers agree and a hash gate holds it; tool = it runs from where you would reach for it; gate = it has been seen to go RED; doc = it matches the code it cites. Pass null or an empty string to clear."
        scope:
          type: array
          items:
            type: string
          description: "File glob patterns owned by this area. Pass empty array [] to clear."
        watch:
          type: array
          items:
            type: string
          description: "Files whose change invalidates this area's sign-off. Pass empty array [] to clear."
        depends:
          type: array
          items:
            type: string
          description: "Area names this area depends on. Names must be existing areas. Pass empty array [] to clear."

  - name: plan_area_delete
    description: "Delete an area. Refuses if any active tasks are still assigned to it."
    inputSchema:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "Area name to delete"

  # ── Roadmap tools ──
  - name: plan_roadmap_focus
    description: "Get or set the focus area for this session. Omit `area` to read the current focus."
    inputSchema:
      type: object
      properties:
        area:
          type: string
          description: "Area name to focus on. Omit to read current focus."

  - name: plan_roadmap_next
    description: "Show what to work on next, ranked by open task count per area."
    inputSchema:
      type: object
      properties: {}

  - name: plan_roadmap_all
    description: "Show the full roadmap: all areas with open/complete task counts, plus unfiled tasks."
    inputSchema:
      type: object
      properties: {}

  - name: plan_area_stats
    description: "Return structured area/task stats for the active project (state, counts, startability). Use the result to build or update the area progress artifact."
    inputSchema:
      type: object
      properties: {}

  # ── Release / RC tools ──
  - name: plan_release_new
    description: "Create a new release for this project (e.g. 'v1.0'). Starts in planning state."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Release name, e.g. 'v1.0' or 'mesh-gateway-1.0'"
        description:
          type: string
          description: "Optional description"
        start_date:
          type: string
          description: "ISO date YYYY-MM-DD"
        target_date:
          type: string
          description: "ISO date YYYY-MM-DD"
      required:
        - name

  - name: plan_release_list
    description: "List all releases for this project."
    inputSchema:
      type: object
      properties: {}

  - name: plan_release_show
    description: "Show a release with its RCs, scope, and notes."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Release name"
      required:
        - name

  - name: plan_release_state
    description: "Set the state of a release: planning | active | released | abandoned"
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Release name"
        state:
          type: string
          enum: [planning, active, released, abandoned]
      required:
        - name
        - state

  - name: plan_release_notes
    description: "Set (or append to) release notes."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Release name"
        notes:
          type: string
          description: "Markdown notes"
        append:
          type: boolean
          description: "Append to existing notes instead of replacing (default false)"
      required:
        - name
        - notes

  - name: plan_release_scope
    description: "Add or remove an area from a release's scope (or a specific RC's scope)."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        area:
          type: string
          description: "Area name"
        action:
          type: string
          enum: [add, remove]
          description: "add (default) or remove"
        rc_number:
          type: integer
          description: "Scope to this RC only; omit to apply to the whole release"
      required:
        - release
        - area

  - name: plan_rc_new
    description: "Add a release candidate to a release. rc_number auto-increments if omitted."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number (1, 2, 3 …). Auto-assigned if omitted."
        start_date:
          type: string
          description: "ISO date"
        target_date:
          type: string
          description: "ISO date"
        notes:
          type: string
          description: "Initial notes"
      required:
        - release

  - name: plan_rc_start
    description: "Set an RC active. Gate: all earlier RCs for this release must be released first."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number to start"
      required:
        - release
        - rc_number

  - name: plan_rc_release
    description: "Attempt to release an RC. Returns blockers (open tasks, open depends) or marks it released. Also warns about unfiled tasks and missing artifact_ref. Captures commit SHA from HEAD automatically."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number to release"
        notes:
          type: string
          description: "Optional release notes to append"
        artifact_ref:
          type: string
          description: "Optional free-text artifact identity (e.g. 'firmware.bin 1343936B sha256=abc'). Stored verbatim. Warns if absent."
      required:
        - release
        - rc_number

  - name: plan_rc_deploy
    description: "Record that a released RC has been deployed (e.g. flashed to hardware). Sets deployed_at timestamp and an optional free-text ref. Never gated — call when the physical act is confirmed."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number"
        ref:
          type: string
          description: "Optional free-text deployment description (e.g. 'OTA bench rotator', 'USB flash prod unit')"
      required:
        - release
        - rc_number

  - name: plan_rc_artifact
    description: "Set or update artifact_ref on a release candidate. No state restriction — call any time, including after release. artifact_ref is free-text; the project gives it meaning (e.g. 'firmware.bin 1343936B sha256=...')."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number"
        artifact_ref:
          type: string
          description: "Free-text artifact description (caller-defined format)"
      required:
        - release
        - rc_number
        - artifact_ref

  - name: plan_rc_backfill_sha
    description: "One-shot repair: set commit_sha on a released RC where it is NULL (e.g. released before patch-21). Refuses if commit_sha is already set — prevents silent overwrite of the provenance fact."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number"
        commit_sha:
          type: string
          description: "The full or abbreviated commit SHA the RC was cut from (caller vouches for correctness)"
      required:
        - release
        - rc_number
        - commit_sha

  - name: plan_rc_notes
    description: "Set (or append to) notes on a release candidate."
    inputSchema:
      type: object
      properties:
        release:
          type: string
          description: "Release name"
        rc_number:
          type: integer
          description: "RC number"
        notes:
          type: string
          description: "Markdown notes"
        append:
          type: boolean
          description: "Append to existing notes (default false)"
      required:
        - release
        - rc_number
        - notes

  # ── Step tools (individual items) ──
  - name: plan_step_switch
    description: "Switch to a specific step within active task"
    inputSchema:
      type: object
      properties:
        number:
          type: integer
          description: "Step number (1-indexed within task)"
      required:
        - number

  - name: plan_step_show
    description: "Show detailed information about a step"
    inputSchema:
      type: object
      properties:
        number:
          type: integer
          description: "Step number (omit for active step)"

  - name: plan_step_list
    description: "List all steps in the active task"
    inputSchema:
      type: object
      properties:
        task:
          type: string
          description: "Task name (omit for active)"

  - name: plan_step_done
    description: "Mark a step as complete"
    inputSchema:
      type: object
      properties:
        number:
          type: integer
          description: "Step number to complete"
      required:
        - number

  - name: plan_step_notes_set
    description: "Set a note on a step. Pass id to update an existing note or omit to create new."
    inputSchema:
      type: object
      properties:
        text:
          type: string
          description: "Note text to set"
        number:
          type: integer
          description: "Step number (omit for active step)"
        id:
          type: integer
          description: "Note ID to update (omit to create new)"
      required:
        - text

  - name: plan_step_notes_get
    description: "View notes on a step. Returns notes with IDs for use with set/delete."
    inputSchema:
      type: object
      properties:
        number:
          type: integer
          description: "Step number (omit for active step)"

  - name: plan_step_notes_delete
    description: "Delete a note from a step by ID"
    inputSchema:
      type: object
      properties:
        id:
          type: integer
          description: "Note ID to delete"
        number:
          type: integer
          description: "Step number (omit for active step)"
      required:
        - id

  - name: plan_step_new
    description: "Create a new step in a task"
    inputSchema:
      type: object
      properties:
        title:
          type: string
          description: "Step title"
        task:
          type: string
          description: "Task name (omit for active task)"
        description:
          type: string
          description: "Step description (markdown)"
      required:
        - title

  - name: plan_step_delete
    description: "Soft-delete a step"
    inputSchema:
      type: object
      properties:
        number:
          type: integer
          description: "Step number to delete"
        task:
          type: string
          description: "Task name (omit for active task)"
      required:
        - number

  - name: plan_step_reorder
    description: "Reorder steps within the active task. Provide all step numbers in their desired new order."
    inputSchema:
      type: object
      properties:
        order:
          type: array
          items:
            type: integer
          description: "List of all current step numbers in desired new order (e.g. [3,1,2] moves step 3 to position 1)"
      required:
        - order

  # ── User tools ──
  - name: plan_user_show
    description: "Show the current user (OS login and display name/alias)"
    inputSchema:
      type: object
      properties: {}

  - name: plan_user_set
    description: "Set your display name (alias). This is how you appear in task lists."
    inputSchema:
      type: object
      properties:
        alias:
          type: string
          description: "Display name / alias (e.g. 'PAC')"
      required:
        - alias

  # ── Project tools (workspace metadata) ──
  - name: plan_project_show
    description: "Show project metadata (name, path, description)"
    inputSchema:
      type: object
      properties: {}

  - name: plan_project_list
    description: "List all known projects"
    inputSchema:
      type: object
      properties: {}

  - name: plan_project_set
    description: "Set project metadata (name and/or description). Call this when prompted to identify the project."
    inputSchema:
      type: object
      properties:
        name:
          type: string
          description: "Project name"
        description:
          type: string
          description: "Project description (markdown)"
        key:
          type: string
          description: "Web API key (required when web.key is configured)"

  - name: plan_project_select
    description: "Select the active project (web server use only). Requires web API key."
    inputSchema:
      type: object
      properties:
        project_id:
          type: integer
          description: "Project ID to select as active"
        key:
          type: string
          description: "Web API key (must match web.key in config.yaml)"
      required:
        - project_id
        - key

  - name: plan_project_relink
    description: "Relink an existing project record after moving or renaming a workspace. Defaults the new path to the current workspace."
    inputSchema:
      type: object
      properties:
        project_id:
          type: integer
          description: "Existing project ID to relink"
        old_path:
          type: string
          description: "Previous absolute path of the existing project"
        name:
          type: string
          description: "Existing project name to relink; must be unique"
        new_path:
          type: string
          description: "New absolute path (defaults to current workspace)"
        new_name:
          type: string
          description: "Optional new project name"

  - name: plan_project_purge
    description: "Permanently delete a project and all its data (tasks, steps, notes, attachments, changelog) from the database. Requires confirm=true. Does not affect the workspace files."
    inputSchema:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: "Must be true to proceed. Prevents accidental purges."
        project_id:
          type: integer
          description: "ID of the project to purge. Omit to purge the current workspace project."
        name:
          type: string
          description: "Name of the project to purge (must be unique). Useful for orphaned projects not reachable by CWD."
        force:
          type: boolean
          description: "Purge even if other users have active tasks in the project (default false)."

  # ── File attachment tools ──
  - name: plan_file_attach
    description: "Attach a workspace-relative file to a project, task, or step as a single source of truth. Content is read from the file at display time, not stored in the database."
    inputSchema:
      type: object
      required: [file_path]
      properties:
        file_path:
          type: string
          description: "Path to the file, relative to the workspace root (e.g. 'specs/feature.md')"
        scope:
          type: string
          enum: [project, task, step]
          description: "What to attach to: 'task' (default), 'project', or 'step'"
        kind:
          type: string
          enum: [ref, goal, plan]
          description: "Role of the attachment: 'ref' (default), 'goal', or 'plan'"
        label:
          type: string
          description: "Optional short description of the file"

  - name: plan_file_detach
    description: "Remove a file attachment by ID (does not delete the file itself)"
    inputSchema:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: "Attachment ID to remove (from plan_file_list)"

  - name: plan_file_list
    description: "List file attachments for the active project, task, or step, with inline file content"
    inputSchema:
      type: object
      properties:
        scope:
          type: string
          enum: [project, task, step]
          description: "Scope to list: 'task' (default), 'project', or 'step'"

  # ── Config tools ──
  - name: plan_config_show
    description: "Show current configuration (merged defaults + config.yaml overrides)"
    inputSchema:
      type: object
      properties: {}

  - name: plan_config_set
    description: "Set a configuration value in config.yaml"
    inputSchema:
      type: object
      properties:
        section:
          type: string
          description: "Configuration section (e.g. 'workflow')"
        key:
          type: string
          description: "Configuration key within the section"
        value:
          description: "Value to set (string, number, or boolean)"
      required:
        - section
        - key
        - value

  # ── Report tools ──
  - name: plan_project_report
    description: "Generate a project report (.md) with all tasks, goals, plans, and steps. Written to workspace directory."
    inputSchema:
      type: object
      properties: {}

  - name: plan_task_report
